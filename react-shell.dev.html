<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Bilang — React shell (dev only, Item 22)</title>
  <!--
    DEV-ONLY entry, Item 22 Steps 2-11. Not part of the production build.

    Why this file exists: F3 requires one clean cut, not a gradual
    coexistence of the old and new client in production. The old vanilla
    app (index.html + js/app.js) stays the thing Vercel actually ships
    through Step 11; Step 12 alone deletes it and promotes the React app.
    That means the React app being built in src/ during Steps 2-11 needs
    somewhere to run *before* it's wired into index.html — this file is
    that somewhere, for `npm run dev` / `vite preview` only.

    It is deliberately NOT referenced by index.html and NOT listed in
    vite.config.mjs's build input, so `vite build` (and therefore every
    Vercel deploy) ignores it — confirmed in the Step 2 verification
    notes. Deleted at Step 12 alongside the old client, once index.html
    itself becomes this file's replacement.
  -->
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <div id="root"></div>
  <!-- Vendored MIT-licensed QR encoder (Kazuhiko Arase), same script
       index.html loads — ShareScreen.jsx (Item 22 Step 5) needs
       `window.qrcode` present before it mounts. Added in the Steps 5-7
       pass since Step 2's stub screens had no QR rendering yet. -->
  <script src="/js/vendor/qrcode.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
